name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25.x" # minimum supported minor, latest patch
          - "stable" # latest stable release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  webbench:
    name: Web benchmarks (sanity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: benchmarks/go.sum

      - name: Vet
        run: go vet ./...

      - name: Sanity (all frameworks answer all scenarios)
        run: go test -run TestScenarioSanity -v

      - name: Benchmarks smoke run
        run: go test -run xxx -bench . -benchtime 1x
