name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25.x" # minimum supported minor, latest patch
          - "stable" # latest stable release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  preview:
    # Go 1.27 generic methods only exist in the go1.27 build-tagged files; verify them
    # with the released 1.27 toolchain (the former go1.27rc2 pin is obsolete now that
    # 1.27 is stable).
    name: Go 1.27 (generic methods)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Toolchain
        run: GOTOOLCHAIN=go1.27.1 go version

      - name: Vet
        run: GOTOOLCHAIN=go1.27.1 go vet ./...

      - name: Test
        run: GOTOOLCHAIN=go1.27.1 go test ./...

  fmt:
    # Files with //go:build go1.27 use generic-method syntax, so formatting must be
    # checked with a Go 1.27+ gofmt.
    name: gofmt (1.27)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Check formatting
        run: |
          test -z "$(GOTOOLCHAIN=go1.27.1 gofmt -l .)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go 1.27 includes the build-tagged generic methods in lint coverage.
      # Pin the toolchain alongside golangci-lint: newer stable patches can emit
      # unified export data that this linter version cannot decode.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Test with race detector
        run: go test -race ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Collect coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
