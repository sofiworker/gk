name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25.x" # minimum supported minor, latest patch
          - "stable" # latest stable release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  preview:
    # Go 1.27 generic methods only exist in the go1.27 build-tagged files; verify them
    # with the released 1.27 toolchain (the former go1.27rc2 pin is obsolete now that
    # 1.27 is stable).
    name: Go 1.27 (generic methods)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Toolchain
        run: GOTOOLCHAIN=go1.27.1 go version

      - name: Vet
        run: GOTOOLCHAIN=go1.27.1 go vet ./...

      - name: Test
        run: GOTOOLCHAIN=go1.27.1 go test ./...

  fmt:
    # Files with //go:build go1.27 use generic-method syntax, so formatting must be
    # checked with a Go 1.27+ gofmt.
    name: gofmt (1.27)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Check formatting
        run: |
          test -z "$(GOTOOLCHAIN=go1.27.1 gofmt -l .)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lint runs on Go 1.27: the go1.27 build-tagged files (generic methods) are
      # excluded from a 1.25 toolchain, so a 1.25 lint job would silently never
      # cover them. golangci-lint must be >= v2.13.0 for Go 1.27 support — older
      # versions fail to read unified export data and emit bogus typecheck errors.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: run ./...

      - name: Dependency policy
        run: bash scripts/check-deps.sh

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Test with race detector
        run: go test -race ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Collect coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  webbench:
    name: Web benchmarks (sanity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: benchmarks/go.sum

      - name: Vet
        run: go vet ./...

      - name: Sanity (all frameworks answer all scenarios)
        run: go test -run TestScenarioSanity -v
